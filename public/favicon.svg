      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Contorno de Corazón Rojo Oficial Mediko -->
  <path
    d="M 64 108 C 25 80, 10 58, 10 37 C 10 19, 23 7, 40 7 C 51 7, 59 13, 64 20 C 69 13, 77 7, 88 7 C 105 7, 118 19, 118 37 C 118 58, 103 80, 64 108 Z"
